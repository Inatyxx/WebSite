<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Boutarin Antoine</title>
  <meta name="description" content="Me contacter : email, LinkedIn, GitHub et CV téléchargeable en français ou en anglais." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Boutarin Antoine" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Contact — Boutarin Antoine" />
  <meta property="og:description" content="Me contacter : email, LinkedIn, GitHub et CV téléchargeable en français ou en anglais." />
  <meta property="og:url" content="https://inatyxx.com/contact.html" />
  <meta property="og:image" content="https://inatyxx.com/Img/Moi.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">Boutarin<span class="dot"> Antoine</span></a>
    <button id="burger" class="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="nav" class="site-nav">
      <ul>
        <li><a href="/"    data-i18n="nav.home"></a></li>
        <li><a href="projects.html" data-i18n="nav.projects"></a></li>
        <li><a class="primary-btn" href="contact.html" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="fr" title="Français"><img src="Img/frenchflag.png" alt="FR" /></button>
        <button class="lang-btn" data-lang="en" title="English"><img src="Img/ukflag.png" alt="EN" /></button>
      </div>
    </nav>
  </div>
</header>

<main class="contact-wrapper">
  <div class="contact-header">
    <h1 data-i18n="contact.title"></h1>
    <p data-i18n="contact.sub"></p>
  </div>

  <div class="contact-grid">

    <div class="contact-card">
      <h2 data-i18n="contact.info.title"></h2>

      <div class="contact-row">
        <span class="label" data-i18n="contact.info.location"></span>
        <span class="value">Lyon, France</span>
      </div>
      <div class="contact-row">
        <span class="label" data-i18n="contact.info.phone"></span>
        <span class="value"><a href="tel:+33769006334">07 69 00 63 34</a></span>
      </div>
      <div class="contact-row">
        <span class="label" data-i18n="contact.info.email"></span>
        <span class="value"><a href="mailto:antoine.temt@gmail.com">antoine.temt@gmail.com</a></span>
      </div>
      <div class="contact-row">
        <span class="label" data-i18n="contact.info.linkedin"></span>
        <span class="value">
          <a href="https://www.linkedin.com/in/antoine-boutarin-3aba61298/" target="_blank" rel="noopener">Boutarin Antoine ↗</a>
        </span>
      </div>
      <div class="contact-row">
        <span class="label" data-i18n="contact.info.github"></span>
        <span class="value">
          <a href="https://github.com/Inatyxx" target="_blank" rel="noopener">Inatyxx ↗</a>
        </span>
      </div>
    </div>

    <div class="contact-card">
      <h2 data-i18n="contact.cv.title"></h2>
      <p style="color: var(--muted); font-size: 0.88rem; margin-bottom: 1.2rem;" data-i18n="contact.cv.desc"></p>
      <a class="btn" href="Img/CV Antoine Boutarin - FR.pdf" download data-i18n="contact.cv.btn" data-i18n-href="contact.cv.href"></a>
    </div>

  </div>
</main>

<footer class="site-footer">
  <span data-i18n="footer.text"></span> <a href="contact.html" data-i18n="footer.contact"></a>
</footer>

<script src="i18n.js"></script>
<script>
  const burger = document.getElementById('burger');
  const nav    = document.getElementById('nav');
  burger.addEventListener('click', () => {
    burger.classList.toggle('open');
    nav.classList.toggle('open');
  });
</script>
</body>
</html>
