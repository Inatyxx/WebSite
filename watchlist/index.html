<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WatchList — Boutarin Antoine</title>
<link rel="stylesheet" href="../style.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap');

  .wl-hero{
    padding:4rem 5vw 2rem;
    text-align:center;
  }
  .wl-hero h1{
    font-size:2.4rem;
    font-weight:800;
    letter-spacing:-0.03em;
  }
  .wl-hero p{
    color:var(--muted);
    margin-top:0.6rem;
    font-size:0.95rem;
  }

  .wl-config{
    max-width:640px;margin:0 auto 1.5rem;
    background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
    padding:0.9rem 1.1rem;font-size:0.85rem;color:var(--muted);
    display:flex;align-items:center;justify-content:space-between;gap:0.7rem;flex-wrap:wrap;
  }
  .wl-config.wl-ok{border-color:rgba(0,229,255,0.35);color:var(--accent-2);}
  .wl-config button{
    background:var(--accent);border:none;color:#fff;font-family:'Syne',sans-serif;font-weight:700;
    font-size:0.8rem;padding:0.5rem 0.9rem;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .wl-config button:hover{opacity:0.85;}

  .wl-keypanel{
    max-width:640px;margin:0 auto 1.5rem;background:var(--bg-card);
    border:1px solid var(--accent);border-radius:12px;padding:1rem 1.1rem;
  }
  .wl-keypanel p{margin:0 0 0.7rem;font-size:0.82rem;color:var(--muted);line-height:1.6;}
  .wl-keypanel a{color:var(--accent-2);}
  .wl-keypanel .wl-keyrow{display:flex;gap:0.5rem;flex-wrap:wrap;}
  .wl-keypanel input{
    flex:1 1 220px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);
    font-family:'Space Mono',monospace;font-size:0.8rem;padding:0.6rem;border-radius:8px;outline:none;
  }
  .wl-keypanel button{
    background:var(--accent);border:none;color:#fff;font-family:'Syne',sans-serif;font-weight:700;
    font-size:0.85rem;padding:0 1rem;border-radius:8px;cursor:pointer;
  }

  .wl-searchwrap{max-width:640px;margin:0 auto 2.5rem;position:relative;padding:0 5vw;}
  .wl-searchbox{
    background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
    padding:1rem;display:flex;gap:0.6rem;flex-wrap:wrap;
  }
  .wl-searchbox input[type=text]{
    flex:1 1 220px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);
    font-family:'Syne',sans-serif;font-size:0.9rem;padding:0.65rem 0.7rem;border-radius:8px;outline:none;
  }
  .wl-searchbox input::placeholder{color:#4a5578;}
  .wl-searchbox input:focus{border-color:var(--accent);}
  .wl-searchbox select{
    background:var(--bg-2);border:1px solid var(--border);color:var(--text);
    font-family:'Syne',sans-serif;font-size:0.85rem;padding:0.65rem 0.5rem;border-radius:8px;outline:none;
  }
  .wl-searchbox button{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;
    font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;padding:0 1.3rem;border-radius:8px;cursor:pointer;
  }
  .wl-searchbox button:hover{opacity:0.85;}

  .wl-suggest{
    position:absolute;left:5vw;right:5vw;top:calc(100% + 4px);
    background:var(--bg-2);border:1px solid var(--border);border-radius:12px;
    max-height:340px;overflow-y:auto;z-index:20;box-shadow:0 16px 40px rgba(0,0,0,0.5);
  }
  .wl-sugg-item{display:flex;gap:0.6rem;padding:0.5rem 0.6rem;cursor:pointer;align-items:center;border-bottom:1px solid var(--border);}
  .wl-sugg-item:last-child{border-bottom:none;}
  .wl-sugg-item:hover{background:rgba(255,255,255,0.04);}
  .wl-sugg-poster{width:34px;height:50px;object-fit:cover;border-radius:5px;background:var(--border);flex-shrink:0;}
  .wl-sugg-title{font-size:0.85rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wl-sugg-sub{font-family:'Space Mono',monospace;font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}

  .wl-board{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;max-width:100%;margin:0 auto;padding:0 5vw 4rem;}
  @media (max-width:820px){.wl-board{grid-template-columns:1fr;}}
  .wl-col{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1rem;min-height:100px;}
  .wl-col-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:0.8rem;padding-bottom:0.7rem;border-bottom:1px dashed var(--border);}
  .wl-col-head h2{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;margin:0;}
  .wl-col-head .wl-count{font-family:'Space Mono',monospace;font-size:0.75rem;color:var(--muted);}
  .wl-col[data-status="a_voir"] .wl-col-head h2{color:var(--accent-2);}
  .wl-col[data-status="en_cours"] .wl-col-head h2{color:var(--accent);}
  .wl-col[data-status="vu"] .wl-col-head h2{color:#7fd88f;}
  .wl-empty{color:#4a5578;font-size:0.82rem;font-style:italic;padding:0.9rem 0.2rem;text-align:center;}

  .wl-card{position:relative;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;margin-bottom:0.75rem;overflow:hidden;}
  .wl-card-top{display:flex;}
  .wl-card-poster{width:52px;height:78px;object-fit:cover;flex-shrink:0;background:var(--border);}
  .wl-card-poster.wl-noimg{display:flex;align-items:center;justify-content:center;font-size:20px;color:#4a5578;}
  .wl-card-main{flex:1;padding:0.6rem 0.6rem 0.6rem 0.75rem;min-width:0;}
  .wl-card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.88rem;color:var(--text);line-height:1.3;word-break:break-word;}
  .wl-card-title .wl-badge{
    font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.03em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle;
  }
  .wl-card-meta{display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;}
  .wl-stars{display:flex;gap:2px;}
  .wl-star{cursor:pointer;font-size:0.85rem;color:#4a5578;transition:color .1s ease, transform .1s ease;line-height:1;}
  .wl-star:hover{transform:scale(1.15);}
  .wl-star.wl-filled{color:var(--accent-2);}

  .wl-card-actions{display:flex;flex-direction:column;border-left:1px dashed var(--border);width:30px;flex-shrink:0;}
  .wl-card-actions button{flex:1;background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center;}
  .wl-card-actions button:hover{background:rgba(255,255,255,0.05);color:var(--text);}
  .wl-card-actions button.wl-del:hover{color:#e86a6a;}

  .wl-expand-btn{
    width:100%;background:none;border:none;border-top:1px dashed var(--border);color:var(--muted);
    font-family:'Space Mono',monospace;font-size:0.68rem;letter-spacing:0.03em;text-transform:uppercase;
    padding:0.45rem 0.6rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  }
  .wl-expand-btn:hover{color:var(--text);}
  .wl-progress-bar{flex:1;height:4px;background:var(--border);border-radius:2px;margin:0 0.5rem;overflow:hidden;}
  .wl-progress-fill{height:100%;background:var(--accent-2);}

  .wl-seasons{border-top:1px solid var(--border);background:var(--bg);}
  .wl-season{border-bottom:1px solid var(--border);}
  .wl-season:last-child{border-bottom:none;}
  .wl-season-head{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0.7rem;cursor:pointer;font-size:0.78rem;color:var(--muted);}
  .wl-season-head:hover{color:var(--text);}
  .wl-season-head .wl-sname{font-weight:700;}
  .wl-season-head .wl-sprog{font-family:'Space Mono',monospace;font-size:0.65rem;color:#4a5578;}
  .wl-episodes{padding:0.2rem 0.7rem 0.6rem 1.2rem;}
  .wl-ep-row{display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.78rem;}
  .wl-ep-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent-2);cursor:pointer;flex-shrink:0;}
  .wl-ep-num{font-family:'Space Mono',monospace;color:#4a5578;flex-shrink:0;width:24px;}
  .wl-ep-name{color:var(--text);}
  .wl-ep-row.wl-watched .wl-ep-name{color:var(--muted);text-decoration:line-through;}
  .wl-loading-inline{font-size:0.75rem;color:#4a5578;padding:0.5rem 0.7rem;font-family:'Space Mono',monospace;}

  .wl-providers{border-top:1px solid var(--border);background:var(--bg);padding:0.6rem 0.7rem;}
  .wl-providers-row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;}
  .wl-provider-logo{width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .wl-providers-link{
    font-family:'Space Mono',monospace;font-size:0.68rem;color:var(--accent-2);
    text-decoration:none;margin-left:auto;white-space:nowrap;
  }
  .wl-providers-link:hover{text-decoration:underline;}
  .wl-providers-empty{font-size:0.75rem;color:#4a5578;font-style:italic;}

  .wl-loading{text-align:center;color:var(--muted);font-family:'Space Mono',monospace;font-size:0.8rem;padding:2rem;}

  .wl-toast{
    position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--bg-2);border:1px solid var(--accent);color:var(--text);
    font-family:'Space Mono',monospace;font-size:0.78rem;padding:0.6rem 1.1rem;border-radius:20px;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;max-width:80vw;text-align:center;
  }
  .wl-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="../index.html">Boutarin<span class="dot"> Antoine</span></a>
    <nav class="site-nav">
      <ul>
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="../projects.html">Projets</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="wl-hero">
  <p class="section-tag">PROJET · SIDE-PROJECT</p>
  <h1>WatchList</h1>
  <p>Films &amp; séries à voir, en cours, vus — avec suivi épisode par épisode</p>
</div>

<div id="wl-config-area" style="padding:0 5vw;"></div>

<div class="wl-searchwrap">
  <div class="wl-searchbox">
    <input type="text" id="wl-input" placeholder="chercher un film ou une série..." autocomplete="off" />
    <select id="wl-status-select">
      <option value="a_voir">À voir</option>
      <option value="en_cours">En cours</option>
      <option value="vu">Vu</option>
    </select>
    <button type="button" id="wl-manual-add">Ajouter</button>
  </div>
  <div id="wl-suggest" class="wl-suggest" style="display:none;"></div>
</div>

<div id="wl-board" class="wl-board">
  <div class="wl-loading">Chargement…</div>
</div>

<footer class="site-footer">
  <span>© Boutarin Antoine</span> <a href="../contact.html">Contact</a>
</footer>

<div class="wl-toast" id="wl-toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'watchlist-items';
  const KEY_STORAGE = 'tmdb-api-key';
  // Default shared key so friends don't need to configure anything —
  // replace this if you rotate your TMDB key.
  const DEFAULT_KEY = 'd7278cd1efea588cd18020c5632bb43e';

  const STATUSES = [
    {id:'a_voir', label:'À voir'},
    {id:'en_cours', label:'En cours'},
    {id:'vu', label:'Vu'}
  ];
  const TMDB_BASE = 'https://api.themoviedb.org/3';
  const IMG_SM = 'https://image.tmdb.org/t/p/w92';
  const IMG_MD = 'https://image.tmdb.org/t/p/w154';

  const board = document.getElementById('wl-board');
  const configArea = document.getElementById('wl-config-area');
  const input = document.getElementById('wl-input');
  const statusSelect = document.getElementById('wl-status-select');
  const manualAddBtn = document.getElementById('wl-manual-add');
  const suggestBox = document.getElementById('wl-suggest');
  const toastEl = document.getElementById('wl-toast');

  let items = [];
  let apiKey = null;
  let toastTimer = null;
  let searchDebounce = null;
  let expandedItems = new Set();
  let openSeason = {};

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }
  function uid(){ return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  function loadAll(){
    apiKey = localStorage.getItem(KEY_STORAGE) || DEFAULT_KEY;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
    } catch(e){ items = []; }
    renderConfig();
    render();
  }
  function saveItems(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    catch(e){ showToast('Sauvegarde impossible'); }
  }
  function saveKey(k){
    localStorage.setItem(KEY_STORAGE, k);
    apiKey = k;
    renderConfig();
    showToast('Clé TMDB enregistrée');
  }

  function renderConfig(){
    if(apiKey){
      configArea.innerHTML =
        '<div class="wl-config wl-ok">'+
          '<span>✓ TMDB connecté</span>'+
          '<button id="wl-change-key">Changer la clé</button>'+
        '</div>';
      document.getElementById('wl-change-key').addEventListener('click', showKeyPanel);
    } else {
      configArea.innerHTML =
        '<div class="wl-config">'+
          '<span>Connecte TMDB pour la recherche avec affiches + suivi des épisodes</span>'+
          '<button id="wl-open-key">Configurer</button>'+
        '</div>';
      document.getElementById('wl-open-key').addEventListener('click', showKeyPanel);
    }
  }
  function showKeyPanel(){
    const panel = document.createElement('div');
    panel.className = 'wl-keypanel';
    panel.innerHTML =
      '<p>Clé API TMDB (v3 auth) — récupérable sur <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org → Paramètres → API</a>. Utile seulement si tu veux utiliser ta propre clé plutôt que celle par défaut :</p>'+
      '<div class="wl-keyrow">'+
        '<input type="text" id="wl-key-input" placeholder="ta clé API TMDB (v3)" value="'+(apiKey?escapeHtml(apiKey):'')+'" />'+
        '<button id="wl-key-save">Valider</button>'+
      '</div>';
    configArea.innerHTML = '';
    configArea.appendChild(panel);
    document.getElementById('wl-key-save').addEventListener('click', function(){
      const v = document.getElementById('wl-key-input').value.trim();
      if(v) saveKey(v); else renderConfig();
    });
  }

  async function tmdbFetch(path){
    if(!apiKey) throw new Error('pas de clé configurée');
    const sep = path.includes('?') ? '&' : '?';
    const url = TMDB_BASE + path + sep + 'api_key=' + encodeURIComponent(apiKey) + '&language=fr-FR';
    const res = await fetch(url);
    if(!res.ok){
      if(res.status === 401) throw new Error('clé invalide (401)');
      throw new Error('code ' + res.status);
    }
    return res.json();
  }
  async function searchTmdb(q){
    const data = await tmdbFetch('/search/multi?query=' + encodeURIComponent(q) + '&include_adult=false');
    return (data.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv').slice(0, 8);
  }
  async function fetchTvSeasons(tmdbId){
    const data = await tmdbFetch('/tv/' + tmdbId);
    return (data.seasons || []).filter(s => s.season_number >= 1 || s.episode_count > 0);
  }
  async function fetchSeasonEpisodes(tmdbId, seasonNumber){
    const data = await tmdbFetch('/tv/' + tmdbId + '/season/' + seasonNumber);
    return (data.episodes || []).map(e => ({episode_number: e.episode_number, name: e.name}));
  }
  async function fetchProviders(tmdbId, mediaType){
    const data = await tmdbFetch('/' + mediaType + '/' + tmdbId + '/watch/providers');
    const fr = (data.results && data.results.FR) ? data.results.FR : null;
    if(!fr) return {link:null, providers:[]};
    const list = [].concat(fr.flatrate||[], fr.ads||[]);
    const seen = new Set();
    const dedup = list.filter(p => seen.has(p.provider_id) ? false : (seen.add(p.provider_id), true));
    return {link: fr.link || null, providers: dedup};
  }

  input.addEventListener('input', function(){
    const q = input.value.trim();
    clearTimeout(searchDebounce);
    if(!apiKey || q.length < 2){ suggestBox.style.display='none'; return; }
    searchDebounce = setTimeout(async function(){
      try{
        const results = await searchTmdb(q);
        renderSuggestions(results);
      } catch(e){
        suggestBox.style.display='none';
        showToast('Erreur TMDB : ' + e.message);
      }
    }, 400);
  });
  document.addEventListener('click', function(e){
    if(!suggestBox.contains(e.target) && e.target !== input) suggestBox.style.display='none';
  });

  function renderSuggestions(results){
    if(!results.length){ suggestBox.style.display='none'; return; }
    suggestBox.innerHTML = results.map(function(r){
      const title = r.media_type === 'tv' ? r.name : r.title;
      const date = r.media_type === 'tv' ? r.first_air_date : r.release_date;
      const year = date ? date.slice(0,4) : '';
      const poster = r.poster_path ? IMG_SM + r.poster_path : '';
      return '<div class="wl-sugg-item" data-id="'+r.id+'" data-type="'+r.media_type+'">'+
        (poster ? '<img class="wl-sugg-poster" src="'+poster+'" alt="" />' : '<div class="wl-sugg-poster"></div>') +
        '<div><div class="wl-sugg-title">'+escapeHtml(title||'')+'</div>'+
        '<div class="wl-sugg-sub">'+(r.media_type==='tv'?'Série':'Film')+(year?' · '+year:'')+'</div></div>'+
      '</div>';
    }).join('');
    suggestBox.style.display = 'block';
    suggestBox.querySelectorAll('.wl-sugg-item').forEach(function(el){
      el.addEventListener('click', function(){
        const id = el.getAttribute('data-id');
        const type = el.getAttribute('data-type');
        const r = results.find(x => String(x.id) === id && x.media_type === type);
        if(r) addFromTmdb(r);
        suggestBox.style.display = 'none';
        input.value = '';
      });
    });
  }

  function addFromTmdb(r){
    const title = r.media_type === 'tv' ? r.name : r.title;
    items.unshift({
      id: uid(), title: title, media_type: r.media_type, tmdb_id: r.id,
      poster_path: r.poster_path || null, status: statusSelect.value, rating: 0,
      seasonsMeta: null, episodesCache: {}, watched: {}, providers: null
    });
    saveItems();
    render();
    showToast('"' + title + '" ajouté');
  }

  manualAddBtn.addEventListener('click', function(){
    const title = input.value.trim();
    if(!title) return;
    items.unshift({
      id: uid(), title: title, media_type:'movie', tmdb_id:null, poster_path:null,
      status: statusSelect.value, rating:0, seasonsMeta:null, episodesCache:{}, watched:{}, providers: null
    });
    saveItems();
    render();
    input.value='';
    suggestBox.style.display='none';
    showToast('Ajouté');
  });

  function removeItem(id){ items = items.filter(i=>i.id!==id); saveItems(); render(); }
  function setStatus(id, status){ const it=items.find(i=>i.id===id); if(it){ it.status=status; saveItems(); render(); } }
  function setRating(id, rating){ const it=items.find(i=>i.id===id); if(it){ it.rating = it.rating===rating?0:rating; saveItems(); render(); } }
  function nextStatus(c){ const o=['a_voir','en_cours','vu']; return o[(o.indexOf(c)+1)%o.length]; }
  function prevStatus(c){ const o=['a_voir','en_cours','vu']; return o[(o.indexOf(c)-1+o.length)%o.length]; }

  function totalEpisodes(it){
    if(!it.seasonsMeta) return 0;
    return it.seasonsMeta.filter(s=>s.season_number>=1).reduce((a,s)=>a+(s.episode_count||0),0);
  }
  function watchedCount(it){
    let n=0;
    Object.keys(it.watched||{}).forEach(function(sn){ if(parseInt(sn,10)>=1) n += (it.watched[sn]||[]).length; });
    return n;
  }

  async function toggleExpand(id){
    if(expandedItems.has(id)){ expandedItems.delete(id); render(); return; }
    expandedItems.add(id);
    const it = items.find(i=>i.id===id);
    if(it && it.media_type==='tv' && !it.seasonsMeta && apiKey && it.tmdb_id){
      render();
      try{
        const seasons = await fetchTvSeasons(it.tmdb_id);
        it.seasonsMeta = seasons.map(s=>({season_number:s.season_number, name:s.name, episode_count:s.episode_count}));
        saveItems();
      } catch(e){ showToast('Erreur de chargement des saisons'); }
    }
    render();
  }

  async function toggleSeason(itemId, seasonNumber){
    if(openSeason[itemId] === seasonNumber){ delete openSeason[itemId]; render(); return; }
    openSeason[itemId] = seasonNumber;
    const it = items.find(i=>i.id===itemId);
    if(it && !it.episodesCache[seasonNumber] && apiKey){
      render();
      try{
        const eps = await fetchSeasonEpisodes(it.tmdb_id, seasonNumber);
        it.episodesCache[seasonNumber] = eps;
        saveItems();
      } catch(e){ showToast('Erreur de chargement des épisodes'); }
    }
    render();
  }

  function toggleEpisode(itemId, seasonNumber, epNumber){
    const it = items.find(i=>i.id===itemId);
    if(!it) return;
    if(!it.watched[seasonNumber]) it.watched[seasonNumber] = [];
    const arr = it.watched[seasonNumber];
    const idx = arr.indexOf(epNumber);
    if(idx >= 0) arr.splice(idx,1); else arr.push(epNumber);
    const wc = watchedCount(it), tc = totalEpisodes(it);
    if(wc > 0 && it.status === 'a_voir') it.status = 'en_cours';
    if(tc > 0 && wc >= tc) it.status = 'vu';
    saveItems();
    render();
  }

  let expandedProviders = new Set();
  async function toggleProviders(id){
    if(expandedProviders.has(id)){ expandedProviders.delete(id); render(); return; }
    expandedProviders.add(id);
    const it = items.find(i=>i.id===id);
    if(it && !it.providers && apiKey && it.tmdb_id){
      render();
      try{
        it.providers = await fetchProviders(it.tmdb_id, it.media_type);
        saveItems();
      } catch(e){ showToast('Erreur de chargement des plateformes'); }
    }
    render();
  }

  function posterHtml(it){
    if(it.poster_path) return '<img class="wl-card-poster" src="'+IMG_MD+it.poster_path+'" alt="" />';
    return '<div class="wl-card-poster wl-noimg">🎬</div>';
  }

  function seasonsHtml(it){
    if(!it.seasonsMeta) return '<div class="wl-loading-inline">'+(apiKey ? 'Chargement des saisons…' : 'Connecte TMDB pour voir les saisons.')+'</div>';
    return '<div class="wl-seasons">' + it.seasonsMeta.map(function(s){
      const isOpen = openSeason[it.id] === s.season_number;
      const w = (it.watched[s.season_number]||[]).length;
      const eps = it.episodesCache[s.season_number];
      let epsHtml = '';
      if(isOpen){
        if(!eps){ epsHtml = '<div class="wl-loading-inline">Chargement…</div>'; }
        else {
          epsHtml = '<div class="wl-episodes">' + eps.map(function(e){
            const checked = (it.watched[s.season_number]||[]).indexOf(e.episode_number) >= 0;
            return '<label class="wl-ep-row '+(checked?'wl-watched':'')+'">'+
              '<input type="checkbox" '+(checked?'checked':'')+' data-item="'+it.id+'" data-season="'+s.season_number+'" data-ep="'+e.episode_number+'" class="wl-ep-check" />'+
              '<span class="wl-ep-num">E'+e.episode_number+'</span>'+
              '<span class="wl-ep-name">'+escapeHtml(e.name||'')+'</span>'+
            '</label>';
          }).join('') + '</div>';
        }
      }
      return '<div class="wl-season">'+
        '<div class="wl-season-head" data-item="'+it.id+'" data-season="'+s.season_number+'">'+
          '<span class="wl-sname">'+escapeHtml(s.name)+'</span>'+
          '<span class="wl-sprog">'+w+'/'+s.episode_count+' '+(isOpen?'▲':'▼')+'</span>'+
        '</div>'+ epsHtml + '</div>';
    }).join('') + '</div>';
  }

  function providersHtml(it){
    if(!it.providers) return '<div class="wl-loading-inline">'+(apiKey ? 'Chargement…' : 'Connecte TMDB pour voir les plateformes.')+'</div>';
    if(!it.providers.providers.length){
      return '<div class="wl-providers"><span class="wl-providers-empty">Pas dispo en streaming légal en France pour l\'instant.</span></div>';
    }
    const logos = it.providers.providers.map(function(p){
      return '<img class="wl-provider-logo" src="'+IMG_SM+p.logo_path+'" alt="'+escapeHtml(p.provider_name)+'" title="'+escapeHtml(p.provider_name)+'" />';
    }).join('');
    const link = it.providers.link ? '<a class="wl-providers-link" href="'+it.providers.link+'" target="_blank" rel="noopener">Voir les liens →</a>' : '';
    return '<div class="wl-providers"><div class="wl-providers-row">'+logos+link+'</div></div>';
  }

  function cardHtml(it){
    let stars = '';
    for(let i=1;i<=5;i++){
      stars += '<span class="wl-star '+(i<=it.rating?'wl-filled':'')+'" data-id="'+it.id+'" data-rating="'+i+'">★</span>';
    }
    const isTv = it.media_type === 'tv';
    const isExpanded = expandedItems.has(it.id);
    let expandSection = '';
    if(isTv){
      const tc = totalEpisodes(it), wc = watchedCount(it);
      const pct = tc>0 ? Math.round(wc/tc*100) : 0;
      expandSection =
        '<button class="wl-expand-btn" data-id="'+it.id+'">'+
          '<span>Saisons</span>'+
          (tc>0 ? '<span class="wl-progress-bar"><span class="wl-progress-fill" style="width:'+pct+'%"></span></span><span>'+wc+'/'+tc+'</span>' : '<span></span>')+
          '<span>'+(isExpanded?'▲':'▼')+'</span>'+
        '</button>' + (isExpanded ? seasonsHtml(it) : '');
    }
    const provExpanded = expandedProviders.has(it.id);
    const providersSection =
      '<button class="wl-expand-btn" data-provid="'+it.id+'">'+
        '<span>Où regarder</span><span></span><span>'+(provExpanded?'▲':'▼')+'</span>'+
      '</button>' + (provExpanded ? providersHtml(it) : '');
    return (
      '<div class="wl-card" data-id="'+it.id+'">' +
        '<div class="wl-card-top">' + posterHtml(it) +
          '<div class="wl-card-main">' +
            '<div class="wl-card-title">'+escapeHtml(it.title)+(isTv?'<span class="wl-badge">Série</span>':'')+'</div>' +
            '<div class="wl-card-meta"><div class="wl-stars">'+stars+'</div></div>' +
          '</div>' +
          '<div class="wl-card-actions">' +
            '<button class="wl-prev" data-id="'+it.id+'">‹</button>' +
            '<button class="wl-next" data-id="'+it.id+'">›</button>' +
            '<button class="wl-del" data-id="'+it.id+'">✕</button>' +
          '</div>' +
        '</div>' + expandSection + providersSection +
      '</div>'
    );
  }

  function render(){
    board.innerHTML = '';
    STATUSES.forEach(function(s){
      const colItems = items.filter(it=>it.status===s.id);
      const col = document.createElement('div');
      col.className = 'wl-col';
      col.setAttribute('data-status', s.id);
      col.innerHTML =
        '<div class="wl-col-head"><h2>'+s.label+'</h2><span class="wl-count">'+colItems.length+'</span></div>' +
        (colItems.length ? colItems.map(cardHtml).join('') : '<div class="wl-empty">Rien ici pour l\'instant</div>');
      board.appendChild(col);
    });
    board.querySelectorAll('.wl-star').forEach(el=>el.addEventListener('click', ()=>setRating(el.getAttribute('data-id'), parseInt(el.getAttribute('data-rating'),10))));
    board.querySelectorAll('.wl-next').forEach(el=>el.addEventListener('click', ()=>{const it=items.find(i=>i.id===el.getAttribute('data-id'));if(it)setStatus(it.id,nextStatus(it.status));}));
    board.querySelectorAll('.wl-prev').forEach(el=>el.addEventListener('click', ()=>{const it=items.find(i=>i.id===el.getAttribute('data-id'));if(it)setStatus(it.id,prevStatus(it.status));}));
    board.querySelectorAll('.wl-del').forEach(el=>el.addEventListener('click', ()=>removeItem(el.getAttribute('data-id'))));
    board.querySelectorAll('.wl-expand-btn[data-id]').forEach(el=>el.addEventListener('click', ()=>toggleExpand(el.getAttribute('data-id'))));
    board.querySelectorAll('.wl-expand-btn[data-provid]').forEach(el=>el.addEventListener('click', ()=>toggleProviders(el.getAttribute('data-provid'))));
    board.querySelectorAll('.wl-season-head').forEach(el=>el.addEventListener('click', ()=>toggleSeason(el.getAttribute('data-item'), parseInt(el.getAttribute('data-season'),10))));
    board.querySelectorAll('.wl-ep-check').forEach(el=>el.addEventListener('change', ()=>toggleEpisode(el.getAttribute('data-item'), parseInt(el.getAttribute('data-season'),10), parseInt(el.getAttribute('data-ep'),10))));
  }

  loadAll();
})();
</script>
</body>
</html>
